[build-system]
requires = ["setuptools>=80.9.0,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag-agent-platform"
version = "0.1.0"
description = "Evidence-grounded RAG API for public and synthetic financial documents."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "pypdf==6.16.1",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires an external service such as PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
