name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run unit tests
        run: python -m pytest -m "not integration"

  integration:
    name: PostgreSQL and pgvector integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINRAG_DATABASE_URL: postgresql://finrag:finrag-local-only@127.0.0.1:5432/finrag
      FINRAG_RUN_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Start isolated PostgreSQL with pgvector
        run: docker compose --env-file .env.example up -d --wait postgres

      - name: Run integration tests
        run: python -m pytest -m integration

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs postgres

      - name: Remove integration services and data
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans
